<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streetwear Collection | Dynamic Catalog</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --accent-color: #f7f7f7;
            --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            text-transform: uppercase;
            overflow-x: hidden;
        }

        /* --- Header & Nav --- */
        header {
            padding: 20px 40px;
            border-bottom: 1px solid #eee;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .nav-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .nav-item {
            text-decoration: none;
            color: var(--text-color);
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 5px 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }

        .nav-item:hover, .nav-item.active {
            border-bottom: 2px solid #000;
        }

        /* --- Hero --- */
        .hero {
            padding: 40px;
            text-align: center;
            background: #000;
            color: #fff;
        }

        .hero h1 {
            font-size: 40px;
            margin: 0;
            font-weight: 900;
            letter-spacing: 2px;
        }

        /* --- Main Layout --- */
        .container {
            padding: 40px;
            min-height: 80vh;
        }

        /* --- Product Grid --- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .product-card.hidden {
            display: none;
            opacity: 0;
            transform: translateY(20px);
        }

        /* --- Image Swap Effect --- */
        .product-image-wrapper {
            background-color: var(--accent-color);
            aspect-ratio: 3/4;
            overflow: hidden;
            position: relative;
            cursor: crosshair;
        }

        .product-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.5s ease-in-out, transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .img-back {
            opacity: 0;
        }

        .product-image-wrapper:hover .img-front {
            opacity: 0;
            transform: scale(1.05);
        }

        .product-image-wrapper:hover .img-back {
            opacity: 1;
            transform: scale(1.05);
        }

        .product-info {
            padding: 15px 0;
            text-align: left;
        }

        .product-category {
            font-size: 10px;
            color: #888;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .product-title {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* --- Footer --- */
        footer {
            padding: 60px 40px;
            border-top: 1px solid #eee;
            text-align: center;
            font-size: 10px;
            color: #666;
            letter-spacing: 1px;
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            header { padding: 15px; }
            .logo { font-size: 20px; }
            .nav-container { gap: 8px; }
            .nav-item { font-size: 9px; padding: 3px 5px; }
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .container { padding: 15px; }
            .hero h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="filterProducts('ALL')">STREETWEAR CATALOG</div>
    <div class="nav-container" id="categoryNav">
        <a class="nav-item active" onclick="filterProducts('ALL')">ALL</a>
        <!-- Categories will be injected here -->
    </div>
</header>

<div class="hero">
    <h1 id="heroTitle">FULL CUSTOMIZATION</h1>
</div>

<div class="container">
    <div class="product-grid" id="productGrid">
        <!-- Products will be injected here -->
    </div>
</div>

<footer>
    &copy; 2026 STREETWEAR PRODUCT CATALOG | PUJIANG SHENGFEILE KNITTING CO., LTD.
</footer>

<script>
    const products = [
        { title: "HEAVYWEIGHT CORE HOODIE", category: "HOODIES", front: "https://sc02.alicdn.com/kf/A17728229fccb41bb85560628d9825d03D.png", back: "https://sc02.alicdn.com/kf/A6197e58eed614e73991b6099513f2b03I.png" },
        { title: "WASHED LOGO HOODIE", category: "HOODIES", front: "https://sc02.alicdn.com/kf/A0432ee17e8414b0cae372a503aa973b8U.png", back: "https://sc02.alicdn.com/kf/A0ab968d0b8654ea2bd5d357031fc2fbey.png" },
        { title: "WIDE LEG CARGO PANTS", category: "PANTS", front: "https://sc02.alicdn.com/kf/A9c4ba56874244acb9f7115b2d6e27104y.png", back: "https://sc02.alicdn.com/kf/A9233b728ce384f50acb3f25d126c9241v.png" },
        { title: "RELAXED CANVAS PANTS", category: "PANTS", front: "https://sc02.alicdn.com/kf/A2ee5b5617e794558850f069c7348a4f38.png", back: "https://sc02.alicdn.com/kf/A01fd9aea95f44d699c3e674faad2f4257.png" },
        { title: "PATCHWORK ZIP HOODIE", category: "PATCHWORK", front: "https://sc02.alicdn.com/kf/A791c43933ae940b3975a975abecd79afl.png", back: "https://sc02.alicdn.com/kf/Afc3e281946be4447be37c77f4e666ec4v.png" },
        { title: "MESH RUNNING SHORTS", category: "SHORTS", front: "https://sc02.alicdn.com/kf/A1e86a919911c48cd90b9185e922c618cU.png", back: "https://sc02.alicdn.com/kf/A603e06967a104ef9bac2a93714f0a18bG.png" },
        { title: "ACID WASH SWEAT SHORTS", category: "SHORTS", front: "https://sc02.alicdn.com/kf/A0e4c853fa3094d0c86b37d16f5d8d2e9i.png", back: "https://sc02.alicdn.com/kf/Aa2d113e8947a48a181b7eccb92a5589cG.png" },
        { title: "BOXEY FIT TEE 01", category: "T-SHIRTS", front: "https://sc02.alicdn.com/kf/A1f05d0c94fff4f389aa42327f30ad318U.png", back: "https://sc02.alicdn.com/kf/A0bfc112d35c049c8a5f6d1b437cb517fs.png" },
        { title: "RHINESTONE VINTAGE TEE", category: "T-SHIRTS", front: "https://sc02.alicdn.com/kf/A21714f0080e24d62968e5082a8e6e2c02.png", back: "https://sc02.alicdn.com/kf/A7d0aa77b9c8240789f01c6757a3cc39cw.png" },
        { title: "VINTAGE WASHED SERIES", category: "VINTAGE", front: "https://sc02.alicdn.com/kf/A617fa57b58134fe7a46b7032a5bea590H.png", back: "https://sc02.alicdn.com/kf/A06f895634da24511bc47ed3ce4ef6902l.png" },
        { title: "CAMO TRUCKER SET", category: "CAMO", front: "https://sc02.alicdn.com/kf/Ab76e8c59ecb34a13bb97f09f39c59b78k.png", back: "https://sc02.alicdn.com/kf/A159f56c458774dbf8bea2d91f1c8b51a3.png" },
        { title: "DARK KNIT HOODIE", category: "DARK", front: "https://sc02.alicdn.com/kf/Af7c399b4dc25495e99db3cb82dbddc93K.png", back: "https://sc02.alicdn.com/kf/A8bb758f3758e4f72ba1f65ec278218ea8.png" }
    ];

    const productGrid = document.getElementById('productGrid');
    const categoryNav = document.getElementById('categoryNav');
    const heroTitle = document.getElementById('heroTitle');

    function init() {
        renderProducts(products);
        renderCategories();
    }

    function renderProducts(data) {
        productGrid.innerHTML = data.map(product => `
            <div class="product-card" data-category="${product.category}">
                <div class="product-image-wrapper">
                    <img src="${product.front}" class="img-front" alt="${product.title}">
                    <img src="${product.back}" class="img-back" alt="${product.title} Back">
                </div>
                <div class="product-info">
                    <div class="product-category">${product.category}</div>
                    <div class="product-title">${product.title}</div>
                </div>
            </div>
        `).join('');
    }

    function renderCategories() {
        const categories = ['ALL', 'HOODIES', 'PANTS', 'T-SHIRTS', 'SHORTS', 'PATCHWORK', 'VINTAGE', 'CAMO', 'DARK'];
        categoryNav.innerHTML = categories.map(cat => `
            <a class="nav-item ${cat === 'ALL' ? 'active' : ''}" onclick="filterProducts('${cat}', this)">${cat}</a>
        `).join('');
    }

    function filterProducts(category, element) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if (element) {
            element.classList.add('active');
        } else {
            document.querySelector('.nav-item').classList.add('active');
        }

        heroTitle.innerText = category === 'ALL' ? 'FULL CUSTOMIZATION' : category + ' CUSTOMIZATION';

        const cards = document.querySelectorAll('.product-card');
        cards.forEach(card => {
            if (category === 'ALL' || card.dataset.category === category) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });
    }

    window.onload = init;
</script>
</body>
</html>
