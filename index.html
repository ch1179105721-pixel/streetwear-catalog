                            </div>
                            <span class="text-[10px] md:text-xs border border-zinc-700 px-2 py-1 font-bold">B2B</span>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function filterProducts(cat) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toUpperCase() === cat.toUpperCase() || (cat === 'T-SHIRTS' && btn.innerText === 'T-SHIRT')) btn.classList.add('active');
            });
            renderProducts(cat);
        }

        renderProducts();
    </script>
</body>
</html>
