<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shengwending - B2B Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; -webkit-font-smoothing: antialiased; }
        .product-card { background: #fff; border-radius: 4px; overflow: hidden; height: 100%; border: 1px solid #111; }
        .img-container { position: relative; background: #fff; aspect-ratio: 1/1; overflow: hidden; }
        .img-container img { width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 0.5s ease; }
        .img-container img.loaded { opacity: 1; }
        .category-btn.active { border-bottom: 2px solid #fff; color: #fff; }
        .hero-banner { 
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://sc01.alicdn.com/kf/A0a0c551a487c4bad820da37c3fb582916.jpg');
            background-size: cover; background-position: center;
        }
    </style>
</head>
<body class="p-2 md:p-8">
    <header class="mb-6 px-2">
        <h1 class="text-2xl md:text-5xl font-black tracking-tighter uppercase text-white">PUJIANG SHENGWENDING</h1>
    </header>
    <section class="hero-banner w-full aspect-[21/9] mb-8 rounded-sm"></section>
    <nav class="flex gap-5 mb-8 text-xs font-bold sticky top-0 bg-black py-4 z-20 overflow-x-auto px-2 border-b border-zinc-900">
        <button onclick="filterProducts('ALL')" class="category-btn active">ALL</button>
        <button onclick="filterProducts('HOODIES')" class="category-btn">HOODIES</button>
        <button onclick="filterProducts('T-SHIRTS')" class="category-btn">T-SHIRT</button>
        <button onclick="filterProducts('SHORTS')" class="category-btn">SHORTS</button>
        <button onclick="filterProducts('PANTS')" class="category-btn">PANTS</button>
        <button onclick="filterProducts('DARK')" class="category-btn">DARK</button>
        <button onclick="filterProducts('VINTAGE')" class="category-btn">VINTAGE</button>
        <button onclick="filterProducts('SYMBOLIC')" class="category-btn">SYMBOLIC</button>
        <button onclick="filterProducts('CAMO')" class="category-btn">CAMO</button>
        <button onclick="filterProducts('PATCHWORK')" class="category-btn">PATCHWORK</button>
        <button onclick="filterProducts('CAPS')" class="category-btn">CAPS</button>
    </nav>
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    <button id="loadMoreBtn" onclick="renderMore()" class="bg-white text-black p-3 font-black block mx-auto mt-8">LOAD MORE</button>
    <script>
        const allProducts = [{"id": "HOO-3", "category": "HOODIES", "name": "HOODIES STYLE 3", "image": "HOODIES/3/DSC01616-1.jpg", "hoverImage": "HOODIES/3/DSC01616-1.jpg"}, {"id": "HOO-4", "category": "HOODIES", "name": "HOODIES STYLE 4", "image": "HOODIES/4/DSC01608-1.jpg", "hoverImage": "HOODIES/4/DSC01614-1.jpg"}, {"id": "HOO-8", "category": "HOODIES", "name": "HOODIES STYLE 8", "image": "HOODIES/8/DSC01683-1.jpg", "hoverImage": "HOODIES/8/DSC01692-1.jpg"}, {"id": "HOO-10", "category": "HOODIES", "name": "HOODIES STYLE 10", "image": "HOODIES/10/DSC01629-1.jpg", "hoverImage": "HOODIES/10/DSC01636-1.jpg"}, {"id": "HOO-19", "category": "HOODIES", "name": "HOODIES STYLE 19", "image": "HOODIES/19/DSC01649-1.jpg", "hoverImage": "HOODIES/19/DSC01654-1.jpg"}, {"id": "T-S-1", "category": "T-SHIRTS", "name": "T-SHIRTS STYLE 1", "image": "T-SHIRTS/1/4.jpg", "hoverImage": "T-SHIRTS/1/5.jpg"}, {"id": "T-S-4", "category": "T-SHIRTS", "name": "T-SHIRTS STYLE 4", "image": "T-SHIRTS/4/DSC01393-1.jpg", "hoverImage": "T-SHIRTS/4/DSC01397-1.jpg"}, {"id": "T-S-9", "category": "T-SHIRTS", "name": "T-SHIRTS STYLE 9", "image": "T-SHIRTS/9/DSC01365-1.jpg", "hoverImage": "T-SHIRTS/9/DSC01369-1.jpg"}, {"id": "T-S-10", "category": "T-SHIRTS", "name": "T-SHIRTS STYLE 10", "image": "T-SHIRTS/10/DSC01343-1.jpg", "hoverImage": "T-SHIRTS/10/DSC01343-1.jpg"}, {"id": "T-S-19", "category": "T-SHIRTS", "name": "T-SHIRTS STYLE 19", "image": "T-SHIRTS/19/DSC01377-1.jpg", "hoverImage": "T-SHIRTS/19/DSC01381-1.jpg"}, {"id": "T-S-22", "category": "T-SHIRTS", "name": "T-SHIRTS STYLE 22", "image": "T-SHIRTS/22/DSC01333-1.jpg", "hoverImage": "T-SHIRTS/22/DSC01334-1.jpg"}, {"id": "T-S-23", "category": "T-SHIRTS", "name": "T-SHIRTS STYLE 23", "image": "T-SHIRTS/23/DSC01322-1.jpg", "hoverImage": "T-SHIRTS/23/DSC01326-1.jpg"}, {"id": "T-S-24", "category": "T-SHIRTS", "name": "T-SHIRTS STYLE 24", "image": "T-SHIRTS/24/DSC01358-1.jpg", "hoverImage": "T-SHIRTS/24/DSC01363-1.jpg"}, {"id": "T-S-35", "category": "T-SHIRTS", "name": "T-SHIRTS STYLE 35", "image": "T-SHIRTS/35/DSC01314-1.jpg", "hoverImage": "T-SHIRTS/35/DSC01319-1.jpg"}, {"id": "DAR-10", "category": "DARK", "name": "DARK STYLE 10", "image": "DARK/10/DSC01343-1.jpg", "hoverImage": "DARK/10/DSC01343-1.jpg"}, {"id": "DAR-19", "category": "DARK", "name": "DARK STYLE 19", "image": "DARK/19/DSC01377-1.jpg", "hoverImage": "DARK/19/DSC01381-1.jpg"}, {"id": "VIN-4", "category": "VINTAGE", "name": "VINTAGE STYLE 4", "image": "VINTAGE/4/DSC01608-1.jpg", "hoverImage": "VINTAGE/4/DSC01614-1.jpg"}, {"id": "VIN-9", "category": "VINTAGE", "name": "VINTAGE STYLE 9", "image": "VINTAGE/9/DSC01365-1.jpg", "hoverImage": "VINTAGE/9/DSC01369-1.jpg"}, {"id": "VIN-19", "category": "VINTAGE", "name": "VINTAGE STYLE 19", "image": "VINTAGE/19/DSC01649-1.jpg", "hoverImage": "VINTAGE/19/DSC01654-1.jpg"}, {"id": "VIN-23", "category": "VINTAGE", "name": "VINTAGE STYLE 23", "image": "VINTAGE/23/DSC01322-1.jpg", "hoverImage": "VINTAGE/23/DSC01326-1.jpg"}, {"id": "SYM-1", "category": "SYMBOLIC", "name": "SYMBOLIC STYLE 1", "image": "SYMBOLIC/1/4.jpg", "hoverImage": "SYMBOLIC/1/5.jpg"}, {"id": "SYM-2", "category": "SYMBOLIC", "name": "SYMBOLIC STYLE 2", "image": "SYMBOLIC/2/DSC01616-1.jpg", "hoverImage": "SYMBOLIC/2/DSC01616-1.jpg"}, {"id": "CAM-4", "category": "CAMO", "name": "CAMO STYLE 4", "image": "CAMO/4/DSC01393-1.jpg", "hoverImage": "CAMO/4/DSC01397-1.jpg"}, {"id": "PAT-35", "category": "PATCHWORK", "name": "PATCHWORK STYLE 35", "image": "PATCHWORK/35/DSC01314-1.jpg", "hoverImage": "PATCHWORK/35/DSC01319-1.jpg"}];
        let filteredProducts = allProducts;
        let currentIndex = 0;
        const itemsPerPage = 16;
        function renderMore() {
            const grid = document.getElementById('productGrid');
            const nextBatch = filteredProducts.slice(currentIndex, currentIndex + itemsPerPage);
            nextBatch.forEach(p => {
                const card = document.createElement('div');
                card.className = "product-card p-1";
                card.innerHTML = `<div class="img-container"><img data-src="${encodeURI(p.image)}" class="lazy"></div><div class="mt-2 text-center"><h3 class="font-bold text-[10px] uppercase text-black truncate">${p.name}</h3></div>`;
                grid.appendChild(card);
            });
            currentIndex += itemsPerPage;
            document.getElementById('loadMoreBtn').style.display = currentIndex >= filteredProducts.length ? 'none' : 'block';
            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.getAttribute('data-src');
                        img.onload = () => img.classList.add('loaded');
                        obs.unobserve(img);
                    }
                });
            }, { rootMargin: '200px' });
            document.querySelectorAll('img.lazy:not(.loaded)').forEach(img => observer.observe(img));
        }
        function filterProducts(cat) {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            filteredProducts = cat === 'ALL' ? allProducts : allProducts.filter(p => p.category === cat);
            currentIndex = 0;
            document.getElementById('productGrid').innerHTML = '';
            renderMore();
        }
        renderMore();
    </script>
</body>
</html>
