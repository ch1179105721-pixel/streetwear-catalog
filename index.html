<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shengfeile Knitting - B2B Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; }
        .product-card img { transition: opacity 0.3s ease-in-out; }
        .product-card:hover .primary-img { display: none; }
        .product-card:hover .hover-img { display: block; }
        .hover-img { display: none; }
        .category-btn.active { border-bottom: 2px solid #fff; }
        @media (max-width: 640px) { .nav-scroll { overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; } }
    </style>
</head>
<body class="p-4 md:p-8">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 border-b border-zinc-800 pb-6 gap-4">
        <div>
            <h1 class="text-3xl md:text-5xl font-black tracking-tighter mb-2">PUJIANG SHENGFEILE KNITTING</h1>
            <p class="text-zinc-500 font-bold tracking-widest text-sm md:text-base">STREETWEAR MANUFACTURING / FULL CUSTOMIZATION</p>
        </div>
        <div class="text-left md:text-right">
            <p class="font-bold text-lg">ONLINE CATALOG 2026</p>
            <p class="text-zinc-500">ZHEJIANG, CHINA</p>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="nav-scroll flex gap-6 md:gap-10 mb-12 text-sm md:text-base font-bold sticky top-0 bg-black py-4 z-10 border-b border-zinc-900 overflow-x-auto">
        <button onclick="filterProducts('ALL')" class="category-btn active hover:text-zinc-400 transition">ALL</button>
        <button onclick="filterProducts('HOODIES')" class="category-btn hover:text-zinc-400 transition">HOODIES</button>
        <button onclick="filterProducts('T-SHIRTS')" class="category-btn hover:text-zinc-400 transition">T-SHIRTS</button>
        <button onclick="filterProducts('SHORTS')" class="category-btn hover:text-zinc-400 transition">SHORTS</button>
        <button onclick="filterProducts('PANTS')" class="category-btn hover:text-zinc-400 transition">PANTS</button>
        <button onclick="filterProducts('CAPS')" class="category-btn hover:text-zinc-400 transition">CAPS</button>
        <button onclick="filterProducts('DARK')" class="category-btn hover:text-zinc-400 transition">DARK</button>
        <button onclick="filterProducts('VINTAGE')" class="category-btn hover:text-zinc-400 transition">VINTAGE</button>
        <button onclick="filterProducts('SYMBOLIC')" class="category-btn hover:text-zinc-400 transition">SYMBOLIC</button>
        <button onclick="filterProducts('CAMO')" class="category-btn hover:text-zinc-400 transition">CAMO</button>
        <button onclick="filterProducts('PATCHWORK')" class="category-btn hover:text-zinc-400 transition">PATCHWORK</button>
    </nav>

    <!-- Product Grid -->
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-8">
        <!-- Products will be injected here -->
    </div>

    <!-- Footer -->
    <footer class="mt-20 pt-10 border-t border-zinc-800 text-center text-zinc-600 text-xs md:text-sm">
        <p>© 2026 PUJIANG SHENGFEILE KNITTING CO., LTD. ALL RIGHTS RESERVED.</p>
        <p class="mt-2 tracking-widest">MINIMALIST B2B INTERFACE V2.0</p>
    </footer>

    <script>
        const products = [
            // SYMBOLIC
            { id: 'SYM-01', category: 'SYMBOLIC', name: 'SYM STYLE 01', image: 'https://img.alicdn.com/imgextra/i3/2215867160172/O1CN01fP2m8H1m8H1m8H1m8H_!!2215867160172.jpg', hoverImage: 'https://img.alicdn.com/imgextra/i3/2215867160172/O1CN019B3O0P1mP1m8H1m8H_!!2215867160172.jpg' },
            { id: 'SYM-02', category: 'SYMBOLIC', name: 'SYM STYLE 02', image: 'https://img.alicdn.com/imgextra/i4/2215867160172/O1CN01p7oO8U1mP1m8H1m8H_!!2215867160172.jpg', hoverImage: 'https://img.alicdn.com/imgextra/i2/2215867160172/O1CN01mP1m8H1m8H1m8H1m8H_!!2215867160172.jpg' },
            { id: 'SYM-03', category: 'SYMBOLIC', name: 'SYM STYLE 03', image: 'https://img.alicdn.com/imgextra/i1/2215867160172/O1CN019B3O0P1mP1m8H1m8H_!!2215867160172.jpg', hoverImage: 'https://img.alicdn.com/imgextra/i3/2215867160172/O1CN01fP2m8H1m8H1m8H1m8H_!!2215867160172.jpg' },
            // DARK
            { id: 'DRK-03', category: 'DARK', name: 'DARK STYLE 03', image: 'https://img.alicdn.com/imgextra/i3/2215867160172/O1CN01mP1m8H1m8H1m8H1m8H_!!2215867160172.jpg', hoverImage: 'https://img.alicdn.com/imgextra/i1/2215867160172/O1CN01mP1m8H1m8H1m8H1m8H_!!2215867160172.jpg' },
            { id: 'DRK-04', category: 'DARK', name: 'DARK STYLE 04', image: 'https://img.alicdn.com/imgextra/i2/2215867160172/O1CN01mP1m8H1m8H1m8H1m8H_!!2215867160172.jpg', hoverImage: 'https://img.alicdn.com/imgextra/i4/2215867160172/O1CN01mP1m8H1m8H1m8H1m8H_!!2215867160172.jpg' },
            // VINTAGE
            { id: 'VIN-02', category: 'VINTAGE', name: 'VINTAGE STYLE 02', image: 'https://img.alicdn.com/imgextra/i1/2215867160172/O1CN01mP1m8H1m8H1m8H1m8H_!!2215867160172.jpg', hoverImage: 'https://img.alicdn.com/imgextra/i3/2215867160172/O1CN01mP1m8H1m8H1m8H1m8H_!!2215867160172.jpg' },
            // CAMO
            { id: 'CAM-03', category: 'CAMO', name: 'CAMO STYLE 03', image: 'https://img.alicdn.com/imgextra/i3/2215867160172/O1CN01mP1m8H1m8H1m8H1m8H_!!2215867160172.jpg', hoverImage: 'https://img.alicdn.com/imgextra/i2/2215867160172/O1CN01mP1m8H1m8H1m8H1m8H_!!2215867160172.jpg' },
            // PATCHWORK
            { id: 'PAT-01', category: 'PATCHWORK', name: 'PATCH STYLE 01', image: 'https://img.alicdn.com/imgextra/i4/2215867160172/O1CN01mP1m8H1m8H1m8H1m8H_!!2215867160172.jpg', hoverImage: 'https://img.alicdn.com/imgextra/i1/2215867160172/O1CN01mP1m8H1m8H1m8H1m8H_!!2215867160172.jpg' }
        ];

        function renderProducts(filter = 'ALL') {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            const filtered = filter === 'ALL' 
                ? products 
                : products.filter(p => p.category === filter);

            filtered.forEach(p => {
                const card = `
                    <div class="product-card group cursor-crosshair">
                        <div class="aspect-[3/4] bg-zinc-900 mb-3 overflow-hidden">
                            <img src="${p.image}" alt="${p.name}" class="primary-img w-full h-full object-cover">
                            <img src="${p.hoverImage}" alt="${p.name}" class="hover-img w-full h-full object-cover">
                        </div>
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-xs md:text-sm tracking-tight">${p.name}</h3>
                                <p class="text-zinc-500 text-[10px] md:text-xs uppercase tracking-widest">${p.id}</p>
                            </div>
                            <span class="text-[10px] md:text-xs border border-zinc-700 px-2 py-1 font-bold">B2B</span>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function filterProducts(cat) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText === cat) btn.classList.add('active');
            });
            renderProducts(cat);
        }

        // Initialize
        renderProducts();
    </script>
</body>
</html>
