        let filteredProducts = allProducts;
        let currentIndex = 0;
        const itemsPerPage = 16;
        const isMobile = window.innerWidth < 768;

        function renderMore() {
            const grid = document.getElementById('productGrid');
            const nextBatch = filteredProducts.slice(currentIndex, currentIndex + itemsPerPage);
            
            nextBatch.forEach(p => {
                const card = document.createElement('div');
                card.className = "product-card p-1";
                const hoverImgTag = isMobile ? '' : `<img data-src="${encodeURI(p.hoverImage)}" class="hover-img hidden group-hover:block absolute inset-0 w-full h-full object-cover">`;
                
                card.innerHTML = `
                    <div class="img-container group">
                        <img data-src="${encodeURI(p.image)}" class="lazy primary-img">
                        ${hoverImgTag}
                    </div>
                    <div class="mt-2">
                        <h3 class="font-bold text-[10px] md:text-sm truncate uppercase">${p.name}</h3>
                        <p class="text-zinc-600 text-[8px] tracking-tighter">${p.id}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            currentIndex += itemsPerPage;
            document.getElementById('loadMoreBtn').style.display = currentIndex >= filteredProducts.length ? 'none' : 'block';
            initLazyLoading();
        }

        function initLazyLoading() {
            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.getAttribute('data-src');
                        img.onload = () => img.classList.add('loaded');
                        obs.unobserve(img);
                    }
                });
            }, { rootMargin: '200px' });
            
            document.querySelectorAll('img.lazy:not(.loaded)').forEach(img => observer.observe(img));
        }

        function filterProducts(cat) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toUpperCase() === (cat === 'T-SHIRTS' ? 'T-SHIRT' : cat)) btn.classList.add('active');
            });
            filteredProducts = cat === 'ALL' ? allProducts : allProducts.filter(p => p.category === cat);
            currentIndex = 0;
            document.getElementById('productGrid').innerHTML = '';
            renderMore();
        }

        renderMore();
    </script>
</body>
</html>
